<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ONCHAT CLEAN</title>

<style>
body { font-family: Arial; background:#0f1115; color:white; text-align:center; }

.chat {
  height:400px;
  overflow:auto;
  border:3px solid orange;
  padding:10px;
  margin:10px auto;
  width:90%;
  max-width:500px;
  border-radius:12px;
}

.msg {
  margin:6px;
  padding:8px;
  border-radius:10px;
  max-width:70%;
}

.left {
  background:#1f3a2d;
  text-align:left;
  margin-right:auto;
}

.right {
  background:#223244;
  text-align:right;
  margin-left:auto;
}

.dm {
  border:2px solid orange;
}

input, select, button {
  padding:8px;
  border-radius:8px;
  border:none;
  margin:4px;
}

button {
  background:orange;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>ONCHAT 🌍 CLEAN</h2>

<!-- ROOM -->
<select id="room">
  <option value="general">🌍 General</option>
  <option value="games">🎮 Games</option>
  <option value="random">🎲 Random</option>
</select>

<br>

<!-- USER -->
<input id="username" placeholder="Enter your name 😎">

<!-- DM -->
<input id="toUser" placeholder="Send to (DM)">

<div id="chat" class="chat"></div>

<input id="msg" placeholder="type message...">

<button onclick="send()">Send</button>
<button onclick="clearChat()">🧹 Clear Room</button>

<script>
const API = "https://onchat-peo0.onrender.com";

const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
const room = document.getElementById("room");
const usernameEl = document.getElementById("username");
const toUser = document.getElementById("toUser");

// save username
usernameEl.value = localStorage.getItem("name") || "";
usernameEl.addEventListener("input", ()=>{
  localStorage.setItem("name", usernameEl.value);
});

// avatar
function getAvatar(name){
  const emojis = ["🐹","🦊","🐸","🐼","🐵","🐯","🦁","🐙"];
  let sum=0;
  for(let i=0;i<name.length;i++) sum+=name.charCodeAt(i);
  return emojis[sum%emojis.length];
}

// time
function timeAgo(ms){
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60) return s+"s";
  const m=Math.floor(s/60);
  if(m<60) return m+"m";
  const h=Math.floor(m/60);
  return h+"h";
}

// load
async function load(){
  const user = usernameEl.value.trim();
  const res = await fetch(`${API}/chat?room=${room.value}&user=${encodeURIComponent(user)}`);
  const data = await res.json();

  chat.innerHTML="";

  data.forEach(m=>{
    const div=document.createElement("div");

    div.className="msg "+(m.user===user?"right":"left");

    if(m.to) div.classList.add("dm");

    div.innerHTML=`
      ${getAvatar(m.user)} <b>${m.user}</b> ${m.to ? "→ "+m.to : ""}: ${m.msg}
      <div style="font-size:10px;opacity:0.6">${timeAgo(m.ts_ms)}</div>
    `;

    chat.appendChild(div);
  });

  chat.scrollTop=chat.scrollHeight;
}

// send
async function send(){
  const user = usernameEl.value.trim() || "Anonymous";
  if(!msg.value.trim()) return;

  await fetch(`${API}/chat?user=${encodeURIComponent(user)}&text=${encodeURIComponent(msg.value)}&room=${room.value}&to=${encodeURIComponent(toUser.value)}`, {
    method:"POST"
  });

  msg.value="";
  load();
}

// 🧹 clear room
async function clearChat(){
  if(!confirm("Clear THIS ROOM? 😭")) return;

  await fetch(`${API}/chat?room=${room.value}`, {
    method:"DELETE"
  });

  load();
}

// events
setInterval(load,800);
room.addEventListener("change", load);
msg.addEventListener("keydown", e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
